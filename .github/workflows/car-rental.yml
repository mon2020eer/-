name: منظومة إيجار السيارات — اختبار وبناء

# المستودع صار مخصَّصاً لهذا التطبيق وحده بعد إزالة مشروع المناقصات، فلم يعد
# ترشيح المسارات لازماً: كل تغيير هنا يخصّه.
on:
  push:
  pull_request:
  workflow_dispatch:          # تشغيل يدوي بضغطة زر لإنتاج ملف .exe عند الطلب

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) الاختبارات على لينكس: أسرع وأرخص، وتكفي للتحقّق من المنطق والواجهة
  # ---------------------------------------------------------------------------
  tests:
    name: الاختبارات (بايثون ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # إصدار قديم وآخر حديث: المكاتب تشتري أجهزة جديدة ببايثون جديد، وتثبيتٌ
        # صارم يصلح اليوم ويُرفض غداً. صدور بايثون 3.14 كسر بناء المالك فعلاً
        # ولم يكشفه CI لأنه كان يعمل على 3.11 وحدها.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: requirements.txt

      # مكتبات النظام التي تحتاجها Qt للعمل بلا شاشة (offscreen)
      - name: تثبيت مكتبات Qt للنظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: تشغيل الاختبارات
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------------
  # 2) بناء ملف ويندوز التنفيذي ورفعه كأداة قابلة للتنزيل
  # ---------------------------------------------------------------------------
  build-windows:
    name: بناء ملف ويندوز التنفيذي
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.15,<7" pytest

      - name: بناء التطبيق
        # بـ python -m لا بالاسم المجرَّد: مجلد Scripts ليس في PATH على كل جهاز
        run: >-
          python -m PyInstaller build/car_rental.spec --noconfirm
          --distpath build/dist --workpath build/work

      # فحص دخان: يشغّل التطبيق فعلياً على ويندوز ويتأكّد أنّه يُقلع ويخرج بسلام
      - name: فحص إقلاع التطبيق
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/dist/CarRentalOffice/CarRentalOffice.exe --version
          ./build/dist/CarRentalOffice/CarRentalOffice.exe --self-test

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: CarRentalOffice-win64
          path: build/dist/CarRentalOffice
          retention-days: 30
